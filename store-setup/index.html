<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Accounts Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
      --font-sans: 'Cairo', system-ui, sans-serif;
      --color-brand: #567DF4;
      --color-ink-bg: #1B1C2E;
      --color-ink-panel: #181829;
      --color-ink-card: #1E1F33;
      --color-ink-soft: #1F2035;
      --color-ink-line: #2A2C42;
    }
    @layer components {
      .card { @apply bg-white dark:bg-ink-card border border-gray-200/60 dark:border-white/[0.06] rounded-xl; }
      .card-title { @apply text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide; }
      .chip { @apply px-3 py-1.5 rounded-full border border-brand/40 text-brand text-[12px] font-medium hover:bg-brand hover:text-white transition-colors; }
      .icon-btn { @apply flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-ink-soft; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    // Apply saved theme/lang before paint to avoid flicker.
    (function () {
      try {
        if (localStorage.getItem('stores.theme') === 'light') document.documentElement.classList.remove('dark');
        if (localStorage.getItem('stores.lang') === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    })();
  </script>
  <style>
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .dot { animation: blink 1.2s infinite both; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
  </style>
</head>
<body class="font-sans antialiased bg-gray-50 dark:bg-ink-bg text-gray-900 dark:text-white">
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-ink-panel/90 backdrop-blur border-b border-gray-200 dark:border-ink-line">
    <div class="px-3 sm:px-4 lg:px-5 flex items-center h-12 gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white">
        <i data-lucide="rocket" class="w-4 h-4"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="text-[13px] font-semibold leading-tight truncate" data-i18n="title">Store Accounts</div>
        <div class="text-[10px] text-gray-400 truncate" data-i18n="sub">Google Play &amp; App Store setup</div>
      </div>
      <button id="resetBtn" class="icon-btn">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span class="hidden sm:inline" data-i18n="reset">Start over</span>
      </button>
      <button id="langBtn" class="icon-btn">
        <i data-lucide="languages" class="w-3.5 h-3.5"></i><span id="langLabel">EN</span>
      </button>
      <button id="themeBtn" class="p-2 rounded-lg bg-gray-100 dark:bg-ink-soft hover:bg-gray-200 dark:hover:bg-ink-line" aria-label="Toggle theme">
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
      </button>
    </div>
  </header>

  <main class="p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-5 gap-3 items-start">
    <!-- Assistant -->
    <section class="lg:col-span-2 lg:sticky lg:top-[3.75rem]">
      <div class="card flex flex-col h-[560px] lg:h-[calc(100vh-4.75rem)]">
        <div class="flex items-center gap-2.5 px-4 h-12 border-b border-gray-200/60 dark:border-white/[0.06]">
          <div class="w-7 h-7 rounded-full bg-brand/10 text-brand flex items-center justify-center">
            <i data-lucide="bot" class="w-4 h-4"></i>
          </div>
          <div class="flex-1">
            <div class="text-[12px] font-semibold" data-i18n="assistant">Setup assistant</div>
            <div class="text-[10px] text-emerald-500 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span><span data-i18n="online">Online</span>
            </div>
          </div>
        </div>
        <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-2.5" aria-live="polite"></div>
        <div id="chips" class="border-t border-gray-200/60 dark:border-white/[0.06] p-3 flex flex-wrap gap-1.5 min-h-[56px] items-center"></div>
      </div>
    </section>

    <!-- Plan -->
    <section class="lg:col-span-3 space-y-3">
      <div id="kpis" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
      <div id="plan" class="space-y-3"></div>
      <p id="footnote" class="text-[10px] text-gray-400 px-1 leading-relaxed"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
